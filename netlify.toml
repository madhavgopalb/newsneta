[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/news"
  status = 200
  force = true

[[redirects]]
  from = "/telangana"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/telangana/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/andhra-pradesh"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/andhra-pradesh/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/.netlify/functions/news"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions."ingest-news"]
  schedule = "*/5 * * * *"
